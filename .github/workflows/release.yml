name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Validate tagged source and prepare verified assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release/release.mjs bundle "${RELEASE_TAG#v}" --out-dir "$RUNNER_TEMP/release-assets"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets
          if-no-files-found: error
  publish:
    needs: verify-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/release-assets
      - name: Publish verified existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release/release.mjs publish "${RELEASE_TAG#v}" --out-dir "$RUNNER_TEMP/release-assets"
